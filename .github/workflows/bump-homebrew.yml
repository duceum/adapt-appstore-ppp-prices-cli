name: Bump Homebrew formula

# Runs after a release is published to PyPI. Opens a pull request against the tap
# with the new sdist url and sha256, so the formula never has to be edited by hand.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump the formula to, e.g. 1.0.1"
        required: true

permissions: {}

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for PyPI to serve the release
        id: sdist
        run: |
          version="${{ steps.version.outputs.value }}"
          for attempt in $(seq 1 20); do
            body=$(curl -fsSL "https://pypi.org/pypi/appstore-ppp-prices/${version}/json" || true)
            if [ -n "$body" ]; then
              url=$(printf '%s' "$body" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
              sha=$(printf '%s' "$body" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "url=$url"  >> "$GITHUB_OUTPUT"
                echo "sha=$sha"  >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "attempt $attempt: not on PyPI yet, waiting"
            sleep 15
          done
          echo "::error::appstore-ppp-prices ${version} never appeared on PyPI"
          exit 1

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: duceum/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Rewrite url and sha256
        run: |
          f=Formula/appstore-ppp-prices.rb
          # Only the first url/sha256 pair belongs to the package itself; the rest are
          # resource blocks and must not be touched.
          awk -v url="${{ steps.sdist.outputs.url }}" -v sha="${{ steps.sdist.outputs.sha }}" '
            !done_url && /^  url "/    { sub(/".*"/, "\"" url "\""); done_url = 1 }
            !done_sha && /^  sha256 "/ { sub(/".*"/, "\"" sha "\""); done_sha = 1 }
            { print }
          ' "$f" > "$f.new" && mv "$f.new" "$f"
          git diff --stat

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: bump-appstore-ppp-prices-${{ steps.version.outputs.value }}
          title: "appstore-ppp-prices ${{ steps.version.outputs.value }}"
          body: |
            Automated bump from
            [appstore-ppp-pricing-agent-skill](https://github.com/duceum/appstore-ppp-pricing-agent-skill).

            Dependencies are unchanged, so the resource blocks are left alone. If a
            dependency was added, removed or pinned differently, regenerate them with
            `brew update-python-resources Formula/appstore-ppp-prices.rb` before merging.
          commit-message: "appstore-ppp-prices ${{ steps.version.outputs.value }}"
