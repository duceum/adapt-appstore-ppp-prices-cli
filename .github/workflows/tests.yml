name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest

  install:
    # The unit tests run against the source tree; this proves the built wheel
    # is self-contained -- countries.csv shipped, entry point wired, no stray
    # top-level module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install dist/*.whl
      - run: |
          cd "$(mktemp -d)"
          python -c "from appstore_ppp_prices.countries import load_countries; assert len(load_countries()) > 100"
          ppp-pricing --help > /dev/null
          appstore-ppp-prices --help > /dev/null
          ppp-pricing --version | grep -qv unknown
          ppp-pricing --clear-cache
