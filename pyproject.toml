[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appstore-ppp-prices"
version = "1.1.0"
description = "PPP pricing for the App Store: bulk-update in-app purchase and subscription prices across 175+ countries by purchasing power. Free, agent-friendly CLI on top of the App Store Connect API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Belousov" }]
keywords = [
    "app-store-connect", "app-store", "pricing", "purchasing-power-parity",
    "price-localization", "in-app-purchase", "subscriptions", "ios", "monetization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
appstore-ppp-prices = "appstore_ppp_prices.cli:main"
ppp-pricing = "appstore_ppp_prices.cli:main"

[tool.setuptools.package-data]
appstore_ppp_prices = ["countries.csv"]

[tool.setuptools.packages.find]
include = ["appstore_ppp_prices*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
[project.urls]
Homepage = "https://github.com/duceum/appstore-ppp-pricing-agent-skill"
Repository = "https://github.com/duceum/appstore-ppp-pricing-agent-skill"
Issues = "https://github.com/duceum/appstore-ppp-pricing-agent-skill/issues"
